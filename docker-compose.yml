services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartel
      POSTGRES_PASSWORD: cartel
      POSTGRES_DB: cartel_deportivo
    ports:
      - "5433:5432"
    volumes:
      - cartel_pg:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - cartel_meili:/meili_data

volumes:
  cartel_pg:
  cartel_meili:
